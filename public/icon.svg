<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="appleMusicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fa2d48" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
  </defs>

  <!-- Squircle Background -->
  <rect x="0" y="0" width="512" height="512" rx="116" ry="116" fill="url(#appleMusicGrad)" />

  <!-- Inner Soft Bevel Highlight -->
  <rect x="0" y="0" width="512" height="512" rx="116" ry="116" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="12" />

  <!-- Apple Music Style Double Music Note (♫ Beamed Eighth Notes) -->
  <g fill="#ffffff">
    <!-- Left Note Head (Angled Ellipse) -->
    <ellipse cx="172" cy="365" rx="52" ry="38" transform="rotate(-24 172 365)" />

    <!-- Right Note Head (Angled Ellipse) -->
    <ellipse cx="340" cy="312" rx="52" ry="38" transform="rotate(-24 340 312)" />

    <!-- Left Vertical Stem -->
    <rect x="202" y="162" width="22" height="200" rx="6" />

    <!-- Right Vertical Stem -->
    <rect x="370" y="108" width="22" height="200" rx="6" />

    <!-- Slanted Crossbar / Beam -->
    <polygon points="202,192 392,138 392,94 202,148" />
  </g>
</svg>